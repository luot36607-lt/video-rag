<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频问答</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e2db;
    --accent: #2f6f4f;
    --accent-soft: #eaf2ec;
    --warn: #a33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 36px 20px 80px; }

  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  select {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px;
    max-width: 100%;
  }

  .player {
    margin-top: 16px; background: #000; border-radius: 14px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  video { display: block; width: 100%; max-height: 62vh; background: #000; }

  .asker {
    margin-top: 18px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px;
  }
  textarea {
    width: 100%; border: 0; outline: 0; resize: none; font: inherit;
    background: transparent; color: var(--ink); min-height: 48px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  button.primary {
    font: inherit; cursor: pointer; border: 0; border-radius: 9px;
    padding: 8px 18px; background: var(--accent); color: #fff;
  }
  button.primary:disabled { opacity: .45; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    font-size: 13px; color: var(--muted); cursor: pointer;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .qa { margin-top: 24px; }
  .q { font-weight: 600; padding-left: 12px; border-left: 3px solid var(--accent); }
  .a {
    margin-top: 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px; white-space: pre-wrap; word-break: break-word;
  }
  .a.refuse { color: var(--muted); }

  .sources { margin-top: 10px; display: grid; gap: 8px; }
  .src {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; font: inherit; color: var(--ink);
  }
  .src:hover { border-color: var(--accent); }
  .src.playing { border-color: var(--accent); background: var(--accent-soft); }
  .src .top { display: flex; align-items: center; gap: 10px; font-size: 13px; flex-wrap: wrap; }
  .src .idx { font-weight: 600; }
  .src .time { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  .src .score { color: var(--muted); margin-left: auto; }
  .src .snip { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .src .hint, .src .vname { color: var(--muted); font-size: 12px; }
  .src.uncited .time { color: var(--muted); }

  .meta { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .error { color: var(--warn); margin-top: 16px; font-size: 14px; }

  #toast {
    position: fixed; left: 50%; bottom: 36px; transform: translate(-50%, 16px);
    background: rgba(31,35,40,.92); color: #fff; padding: 8px 18px;
    border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  .summary {
    margin-top: 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 18px;
  }
  .summary h2 { font-size: 15px; margin: 0 0 6px; }
  .summary .overview { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .chap { border-top: 1px solid var(--line); padding: 8px 0; }
  .chap:first-of-type { border-top: 0; }
  .chap summary { display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none; outline: none; }
  .chap summary::-webkit-details-marker { display: none; }
  .chap .ctitle { font-weight: 600; font-size: 14px; }
  .seek {
    font: inherit; font-size: 12px; color: var(--accent); background: var(--accent-soft);
    border: 0; border-radius: 6px; padding: 2px 7px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .seek:hover { background: var(--accent); color: #fff; }
  .chap ul { margin: 8px 0 2px; padding-left: 18px; }
  .chap li { margin: 5px 0; font-size: 14px; }
  .chap li .seek { margin-left: 6px; }

  .upload {
    margin-top: 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 16px;
  }
  .upload summary { cursor: pointer; font-size: 14px; font-weight: 600; list-style: none; }
  .upload summary::-webkit-details-marker { display: none; }
  .upload .row { margin-top: 10px; flex-wrap: wrap; }
  .upload input[type="file"] { font-size: 13px; }
  .upload input[type="text"] {
    font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 8px; flex: 1; min-width: 140px; background: var(--bg);
  }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  button.ghost {
    font: inherit; font-size: 13px; cursor: pointer; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 12px;
  }
  button.ghost:hover { color: var(--warn); border-color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>视频问答</h1>
      <p class="sub" id="status">正在连接…</p>
    </div>
    <select id="pick"></select>
    <button id="del" class="ghost">删除当前视频</button>
  </div>

  <div class="player">
    <video id="video" controls preload="metadata"></video>
  </div>

  <details class="upload">
    <summary>上传视频（自动转写、建索引）</summary>
    <div class="row">
      <input type="file" id="file" accept="video/*">
      <input type="text" id="vtitle" placeholder="标题（可选）">
      <button class="primary" id="up">上传并解析</button>
    </div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="sub" id="pmsg" style="margin-top:6px"></div>
  </details>

  <div id="summary"></div>

  <div class="asker">
    <textarea id="q" placeholder="问点什么……（Ctrl + Enter 发送）"></textarea>
    <div class="row">
      <span class="sub" id="hint" style="margin:0"></span>
      <button class="primary" id="send">提问</button>
    </div>
  </div>

  <div class="chips" id="chips"></div>
  <div id="out"></div>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const qEl = $("q"), btn = $("send"), out = $("out"), video = $("video"), pick = $("pick");

const SAMPLES = [
  "LangChain 怎么调用通义千问？",
  "怎么用 Ollama 跑本地模型？",
  "聊天模型和大语言模型有什么区别？",
];

let current = null;

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const fmt = (sec) => {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
};

$("chips").innerHTML = SAMPLES.map((s) => `<span class="chip">${esc(s)}</span>`).join("");
document.querySelectorAll(".chip").forEach((el) => {
  el.onclick = () => { qEl.value = el.textContent; ask(); };
});

async function refreshVideos() {
  const vids = await fetch("/videos").then((r) => r.json());
  pick.innerHTML = vids
    .map((v) => `<option value="${v.id}">${esc(v.title)} · ${fmt(v.duration)}</option>`)
    .join("");
  pick.onchange = () => selectVideo(pick.value);
  return vids;
}

async function boot() {
  try {
    const vids = await refreshVideos();
    if (!vids.length) {
      $("status").textContent = "还没有视频，先上传一个";
      return;
    }
    await selectVideo(vids[0].id);
  } catch {
    $("status").textContent = "服务未响应";
  }
}

const STAGE_NAME = {
  queued: "排队中", transcribing: "转写中", fixing: "纠错中", chunking: "分块中",
  summarizing: "生成摘要", indexing: "建索引", done: "完成", failed: "失败",
};

async function pollTask(taskId, videoId) {
  const up = $("up");
  while (true) {
    let t;
    try {
      t = await fetch("/task/" + taskId).then((r) => r.json());
    } catch {
      $("pmsg").textContent = "查询任务失败，稍后刷新页面";
      break;
    }
    const pct = Math.round((t.progress || 0) * 100);
    $("pbar").style.width = pct + "%";
    $("pmsg").textContent = `${STAGE_NAME[t.stage] || t.stage} ${pct}%`;

    if (t.stage === "done" || t.stage === "failed") {
      if (t.stage === "failed") {
        $("pmsg").textContent = "失败：" + (t.error || "未知错误");
      } else {
        $("pmsg").textContent = "完成，已加入视频列表";
        await refreshVideos();
        await selectVideo(videoId);
      }
      up.disabled = false;
      return;
    }
    await new Promise((r) => setTimeout(r, 2000));
  }
}

$("up").onclick = async () => {
  const f = $("file").files[0];
  if (!f) {
    $("pmsg").textContent = "先选一个视频文件";
    return;
  }
  const fd = new FormData();
  fd.append("file", f);
  fd.append("title", $("vtitle").value.trim() || f.name);

  $("up").disabled = true;
  $("pbar").style.width = "0%";
  $("pmsg").textContent = `上传中…（${(f.size / 1e6).toFixed(1)} MB）`;

  try {
    const res = await fetch("/ingest", { method: "POST", body: fd });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const d = await res.json();
    $("pmsg").textContent = "已上传，开始处理…";
    await pollTask(d.task_id, d.video_id);
  } catch (e) {
    $("pmsg").textContent = "上传失败：" + (e.message || e);
    $("up").disabled = false;
  }
};

async function selectVideo(id, start) {
  current = id;
  if (pick.value !== id) pick.value = id;

  if (video.dataset.vid !== id) {
    video.dataset.vid = id;
    video.src = "/video/" + encodeURIComponent(id);
    video.load();
  }

  if (start != null) {
    const go = () => {
      try { video.currentTime = start; } catch (_) {}
      const p = video.play();
      if (p && p.catch) p.catch(() => {
        $("status").textContent = "浏览器拦截了自动播放，请点一下视频";
      });
      toast("已跳到 " + fmt(start));
    };
    if (video.readyState >= 1) go();
    else video.addEventListener("loadedmetadata", go, { once: true });
  }

  loadSummary(id);

  try {
    const info = await fetch("/info").then((r) => r.json());
    $("status").textContent = `${info.videos} 个视频 · ${info.chunks} 块资料`;
  } catch { /* ignore */ }
}

async function loadSummary(id) {
  const box = $("summary");
  try {
    const d = await fetch("/summary/" + encodeURIComponent(id)).then((r) => r.json());
    if (!d.chapters || !d.chapters.length) { box.innerHTML = ""; return; }
    const body = d.chapters.map((c, i) => `
      <details class="chap" ${i === 0 ? "open" : ""}>
        <summary>
          <button class="seek" data-start="${c.start}">${c.time.split(" - ")[0]}</button>
          <span class="ctitle">${esc(c.title)}</span>
        </summary>
        <ul>${c.points.map((p) => `
          <li>${esc(p.text)}
            <button class="seek" data-start="${p.start}">${p.approx ? "≈" : ""}${p.time}</button>
          </li>`).join("")}
        </ul>
      </details>`).join("");

    box.innerHTML = `<div class="summary"><h2>视频摘要</h2>
      <p class="overview">${esc(d.overview)}</p>${body}</div>`;

    box.querySelectorAll(".seek").forEach((el) => {
      el.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        seek(parseFloat(el.dataset.start));
      };
    });
  } catch {
    box.innerHTML = "";
  }
}

function seek(t) {
  const start = () => {
    try { video.currentTime = t; } catch (_) {}
    const p = video.play();
    if (p && p.catch) {
      p.catch((err) => {
        $("status").textContent = "浏览器拦截了自动播放，请先点一下视频（" + err.name + "）";
      });
    }
    toast("已跳到 " + fmt(t));
  };

  if (video.error || video.networkState === 3) {
    $("status").textContent = "视频连接中断，正在重新加载…";
    video.src = "/video/" + encodeURIComponent(current);
    video.load();
    video.addEventListener("loadedmetadata", start, { once: true });
    return;
  }
  if (video.readyState >= 1) start();
  else video.addEventListener("loadedmetadata", start, { once: true });
}

let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

video.addEventListener("error", () => {
  const code = video.error ? video.error.code : "?";
  $("status").textContent = `视频加载失败（错误码 ${code}），刷新页面或检查服务是否在运行`;
});

function render(data) {
  const refused = !data.sources || data.sources.length === 0;
  const multi = new Set((data.sources || []).map((s) => s.video_id)).size > 1;

  const srcs = (data.sources || []).map((s) => `
    <button class="src ${s.cited ? "" : "uncited"}"
            data-start="${s.start}" data-end="${s.end}" data-video="${esc(s.video_id || "")}">
      <div class="top">
        <span class="idx">[${s.index}]</span>
        <span class="time">${s.time.split(" - ")[0]}</span>
        <span class="hint">点击跳转</span>
        ${multi && s.video_title ? `<span class="vname">${esc(s.video_title)}</span>` : ""}
        <span class="score">相似度 ${s.score.toFixed(3)}</span>
      </div>
      <div class="snip">${esc(s.snippet)}…</div>
    </button>`).join("");

  out.insertAdjacentHTML("afterbegin", `
    <div class="qa">
      <div class="q">${esc(data.question)}</div>
      <div class="a ${refused ? "refuse" : ""}">${esc(data.answer)}</div>
      ${srcs ? `<div class="sources">${srcs}</div>` : ""}
      <div class="meta">
        检索 ${data.retrieve_ms ?? "-"}ms · 生成 ${data.generate_ms ?? "-"}ms
        ${data.tokens ? "· " + data.tokens + " tokens" : ""}
      </div>
    </div>`);

  out.querySelectorAll(".src").forEach((el) => {
    el.onclick = () => {
      const t = parseFloat(el.dataset.start);
      const vid = el.dataset.video;
      if (vid && vid !== current) selectVideo(vid, t);
      else seek(t);
    };
  });
}

async function ask() {
  const question = qEl.value.trim();
  if (!question) return;
  btn.disabled = true;
  $("hint").textContent = "检索并生成中…";
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, k: 3, min_score: 0.55 }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    render(await res.json());
    qEl.value = "";
  } catch (e) {
    out.insertAdjacentHTML("afterbegin", `<div class="error">出错了：${esc(String(e.message || e))}</div>`);
  } finally {
    btn.disabled = false;
    $("hint").textContent = "";
  }
}

video.addEventListener("timeupdate", () => {
  const t = video.currentTime;
  out.querySelectorAll(".src").forEach((el) => {
    const a = parseFloat(el.dataset.start), b = parseFloat(el.dataset.end);
    const same = !el.dataset.video || el.dataset.video === current;
    el.classList.toggle("playing", same && t >= a && t <= b);
  });
});

btn.onclick = ask;
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
});
$("del").onclick = async () => {
  if (!current) return;
  const opt = pick.options[pick.selectedIndex];
  const name = opt ? opt.textContent : current;
  if (!confirm(`确定删除「${name}」？\n索引、摘要和上传的视频文件都会一起删掉。`)) return;

  $("del").disabled = true;
  try {
    const r = await fetch("/video/" + encodeURIComponent(current), { method: "DELETE" });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    toast("已删除");
    const vids = await refreshVideos();
    $("out").innerHTML = "";
    $("summary").innerHTML = "";
    if (vids.length) {
      await selectVideo(vids[0].id);
    } else {
      current = null;
      video.removeAttribute("src");
      video.load();
      $("status").textContent = "没有视频了，上传一个吧";
    }
  } catch (e) {
    alert("删除失败：" + (e.message || e));
  } finally {
    $("del").disabled = false;
  }
};

boot();
</script>
</body>
</html>
